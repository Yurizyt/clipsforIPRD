* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
main { max-width: 92ch; }
pre { font: inherit; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
a { color: var(--link); }
.dim { color: var(--dim); }
.a { color: var(--a); }
.b { color: var(--b); }
.warn { background: var(--hl); }
form { display: flex; gap: 1ch; align-items: baseline; margin: 0; }
#yt-url { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--dim); padding: 2px 0; border-radius: 0; }
#yt-url:focus { outline: none; border-bottom-color: var(--fg); }
button { font: inherit; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
button[aria-pressed="true"] { color: var(--fg); text-decoration: none; font-weight: 700; }
button:focus-visible, a:focus-visible { outline: 1px dashed var(--fg); outline-offset: 2px; }
#msg:empty { display: none; }
#msg { margin: 14px 0 20px; }
.ok { color: var(--a); }
.cur::after { content: "_"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cur::after { animation: none; } }
.clip { margin: 0 0 22px; }
textarea { width: 100%; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--dim); margin-top: 4px; }
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tc = sec => { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = (sec % 60).toFixed(1).padStart(4, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${String(m).padStart(2, "0")}:${s}`; };
const pad = (s, n) => String(s).padStart(n, " ");
const url = (id, s) => `https://www.youtube.com/watch?v=${id}&t=${Math.floor(s)}s`;
const parseId = t => { t = (t || "").trim(); if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t; const m = t.match(/(?:v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };

function plain(S, c, i) {
  const nm = k => S.cast.find(x => x[0] === k)[1];
  const dA = c.a[2] - c.a[1], dB = c.b[2] - c.b[1];
  return `${S.lab || "s" + S.n}/${String(i + 1).padStart(2, "0")} ${c.t} ${(dA + dB).toFixed(1)}s\nA ${tc(c.a[1])} - ${tc(c.a[2])} ${dA.toFixed(1)}s ${nm(c.a[0])}\nB ${tc(c.b[1])} - ${tc(c.b[2])} ${dB.toFixed(1)}s ${nm(c.b[0])}\nhttps://youtu.be/${S.id}`;
}
async function copy(btn, text) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "copied"; }
  catch (e) { const ta = document.createElement("textarea"); ta.rows = 4; ta.value = text; ta.setAttribute("aria-label", "cut list"); btn.after(ta); ta.select(); btn.textContent = "select+copy"; }
  setTimeout(() => btn.textContent = btn.dataset.l, 1800);
}

function render(n) {
  const S = SESSIONS.find(x => x.n === n);
  if (!S.clips) { $("#out").innerHTML = ""; return; }
  const nm = k => S.cast.find(x => x[0] === k);
  const w = Math.max(...S.cast.map(c => c[1].length));
  const head = `<pre>${S.lab || "s" + S.n}  ${esc(S.title.toLowerCase())}  <span class="dim">${tc(S.dur).replace(/\.\d$/, "")}</span>  <a href="https://www.youtube.com/watch?v=${S.id}" target="_blank" rel="noopener">${S.id}</a>\n\n` +
    S.cast.filter(c => !["OAC", "Q1", "Q2", "Q3"].includes(c[0])).map(c => `<span class="dim">#</span> ${esc(c[1].padEnd(w, " "))}  <span class="dim">${esc(c[2])}</span>`).join("\n") +
    `\n\n<button type="button" id="cp-all" data-l="[copy all]">[copy all]</button></pre><br>`;
  const seg = (k, s) => {
    const d = (s[2] - s[1]).toFixed(1);
    return `  <span class="${k.toLowerCase()}">${k}</span>  <a href="${url(S.id, s[1])}" target="_blank" rel="noopener">${tc(s[1])}</a> - ${tc(s[2])}  ${pad(d, 4)}s  ${esc(nm(s[0])[1])}\n` +
      `      <span class="dim">"${esc(s[3])}"</span>\n`;
  };
  const body = S.clips.map((c, i) => {
    const tot = (c.a[2] - c.a[1]) + (c.b[2] - c.b[1]);
    return `<pre class="clip">[${String(i + 1).padStart(2, "0")}] ${esc(c.t)}  <span class="dim">${tot.toFixed(1)}s</span>\n` +
      (c.warn ? `  <span class="warn">!! check first: ${esc(c.warn)}</span>\n` : "") +
      seg("A", c.a) + seg("B", c.b) +
      `  <button type="button" data-i="${i}" data-l="[copy]">[copy]</button></pre>`;
  }).join("");
  $("#out").innerHTML = head + body;
  document.querySelectorAll("#out button[data-i]").forEach(b => b.onclick = () => copy(b, plain(S, S.clips[+b.dataset.i], +b.dataset.i)));
  $("#cp-all").onclick = e => copy(e.currentTarget, S.clips.map((c, i) => plain(S, c, i)).join("\n\n"));
}

const FAST = matchMedia("(prefers-reduced-motion: reduce)").matches;
const jit = ms => ms * (0.75 + Math.random() * 0.5);
const sleep = ms => new Promise(r => setTimeout(r, FAST ? 0 : jit(ms)));
let running = false, lastId = null;

async function find() {
  const raw = $("#yt-url").value, msg = $("#msg"), out = $("#out");
  if (running || !raw.trim()) return;
  const id = parseId(raw);
  if (id && id === lastId) return;
  out.innerHTML = "";
  if (!id) { msg.textContent = "err: not a youtube url"; lastId = null; return; }
  running = true; lastId = id;
  const t0 = performance.now();
  const S = SESSIONS.find(x => x.id === id);
  const L = [];
  const show = (tail = true) => { msg.innerHTML = L.join("\n") + (tail ? `\n<span class="cur"></span>` : ""); };
  const add = (s, ms = 0) => { L.push(s); show(); return sleep(ms); };
  const set = s => { L[L.length - 1] = s; show(); };
  const OK = `<span class="ok">ok</span>`, FAIL = `<span class="b">fail</span>`;
  const dots = (label, w = 26) => `${label} ${".".repeat(Math.max(2, w - label.length))}`;
  const bar = p => { const n = Math.round(p * 20); return `[${"#".repeat(n)}${".".repeat(20 - n)}] ${String(Math.round(p * 100)).padStart(3, " ")}%`; };
  const progress = async (label, total, ms, suffix) => {
    L.push(""); let p = 0;
    while (p < 1) {
      p = Math.min(1, p + 0.04 + Math.random() * 0.13);
      set(`  ${label.padEnd(18, " ")} ${bar(p)}  ${suffix ? suffix(p) : ""}`);
      await sleep(ms / 9);
    }
  };

  await add(`$ fetch ${esc(id)}`, 600);
  await add(`  ${dots("resolving video")} `, 700);
  if (!S) { set(`  ${dots("resolving video")} ${FAIL}`); await add(`  <span class="b">err: ${esc(id)} not indexed</span>`); show(false); running = false; return; }
  set(`  ${dots("resolving video")} ${OK}  ${tc(S.dur).replace(/\.\d$/, "")}  en`);
  await add(`  session   ${S.lab || "s" + S.n} · ${esc(S.title.toLowerCase())}`, 500);

  if (!S.clips) {
    await add(`  ${dots("caption tracks")} `, 1100);
    set(`  ${dots("caption tracks")} ${FAIL}  0 found`);
    await add(`  <span class="dim">// ${esc(S.err)}</span>`); show(false); running = false; return;
  }
  const w = WORDS[S.n], people = S.cast.filter(c => !["OAC", "Q1", "Q2", "Q3"].includes(c[0]));
  const segs = S.clips.flatMap(c => [c.a, c.b]);
  await add(`  ${dots("caption tracks")} ${OK}  ${S.n === 1 ? "en/whisper" : "en/asr"}`, 400);
  await progress("pulling captions", w, 2200, p => `${Math.round(p * w)} words`);
  await add(`  ${dots("word timestamps")} `, 1200);
  set(`  ${dots("word timestamps")} ${OK}  ${w} words`);
  await add(`  speaker map`, 400);
  for (const c of people) await add(`    > ${esc(c[1].padEnd(30, " "))}<span class="dim">${esc(c[2])}</span>`, 260);
  await add(`  candidate quotes`, 500);
  for (const s of segs) {
    const q = s[3].length > 58 ? s[3].slice(0, 58) + "…" : s[3];
    await add(`    <span class="dim">${tc(s[1])}  "${esc(q)}"</span>`, 220);
  }
  await add(`  pairing A/B  <span class="dim">max 35.0s · 2 speakers</span>`, 500);
  await add(`  ${dots("shorts")} `, 1000);
  set(`  ${dots("shorts")} ${OK}  ${S.clips.length}`);
  await add(`  ${dots("validating cut points")} `, 1100);
  const maxT = Math.max(...S.clips.map(c => (c.a[2] - c.a[1]) + (c.b[2] - c.b[1])));
  set(`  ${dots("validating cut points")} ${OK}  ${S.clips.length}/${S.clips.length}  max ${maxT.toFixed(1)}s`);
  await add(`  done in ${((performance.now() - t0) / 1000).toFixed(1)}s`, 400);
  show(false);
  render(S.n);
  running = false;
}
$("#find-form").addEventListener("submit", e => { e.preventDefault(); lastId = null; find(); });
$("#yt-url").addEventListener("paste", () => setTimeout(find, 0));
$("#yt-url").addEventListener("input", () => { if (parseId($("#yt-url").value)) find(); });
$("#yt-url").focus();
</script>
</body>
</html>
